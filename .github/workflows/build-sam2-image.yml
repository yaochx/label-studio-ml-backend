name: Build and Push SAM2 Docker Image

on:
  push:
    branches:
      - feature/sam2
      - main
      - master
    tags:
      - 'v*'
    paths:
      - 'label_studio_ml/examples/segment_anything_2_image/**'
      - '.github/workflows/build-sam2-image.yml'
  pull_request:
    branches:
      - feature/sam2
      - main
      - master
    paths:
      - 'label_studio_ml/examples/segment_anything_2_image/**'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag'
        required: false
        default: 'latest'

env:
  DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
  IMAGE_NAME: label-studio-ml-sam2

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Determine image tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag }}"
            if [ -z "$TAG" ] || [ "$TAG" = "" ]; then
              TAG="latest"
            fi
            echo "tag=$TAG" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          elif [ "${{ github.ref }}" == "refs/heads/main" ] || [ "${{ github.ref }}" == "refs/heads/master" ]; then
            echo "tag=latest" >> $GITHUB_OUTPUT
          elif [ "${{ github.ref }}" == "refs/heads/feature/sam2" ]; then
            # For feature/sam2 branch, use branch name and short commit SHA
            echo "tag=feature-sam2-${GITHUB_SHA::8}" >> $GITHUB_OUTPUT
          else
            # For other branches, use branch name (sanitized) and commit SHA
            BRANCH_NAME=$(echo "${{ github.ref_name }}" | sed 's/[^a-zA-Z0-9]/-/g')
            echo "tag=${BRANCH_NAME}-${GITHUB_SHA::8}" >> $GITHUB_OUTPUT
          fi

      - name: Build and push Docker image
        working-directory: label_studio_ml/examples/segment_anything_2_image
        env:
          DOCKER_USERNAME: ${{ env.DOCKER_USERNAME }}
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
          TAG: ${{ steps.tag.outputs.tag }}
          PUSH: ${{ github.event_name != 'pull_request' && 'true' || 'false' }}
        run: |
          chmod +x build.sh
          ./build.sh --push

      - name: Output image info
        run: |
          echo "Image built and pushed: ${{ env.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.tag }}"
          echo "Docker Hub URL: https://hub.docker.com/r/${{ env.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}"
